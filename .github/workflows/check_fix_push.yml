name: check_fix_push

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    if: |
      ${{ github.event.head_commit.message!='chore(actions): check_format_lint' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm run check

      - run: pnpm run format

      - run: pnpm run lint

      - name: Git commit
        id: commit
        run: |
          git config --local user.email github-actions[bot]@users.noreply.github.com
          git config --local user.name github-actions[bot]
          git status --porcelain
          git --no-pager diff
          # GITHUB_TOKEN cannot push .github/workflows changes (no such scope),
          # so revert any format fixes there and commit the rest.
          git checkout -- .github/workflows || true
          git commit -a -m "chore(actions): check_format_lint"
        continue-on-error: true

      - name: Git push
        uses: ad-m/github-push-action@v1
        if: ${{ steps.commit.outcome == 'success' }}
        with:
          branch: ${{ github.ref }}
